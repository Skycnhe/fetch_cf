name: Auto Update Cloudflare IPs By Region

on:
  schedule:
    # 依旧建议每 1 小时或每 30 分钟运行一次
    - cron: '30 * * * *'
  workflow_dispatch: # 允许手动点按执行

jobs:
  update-ips:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Fetch & Geolocation Script
        run: python fetch_cf_ips.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/*
          
          if git diff --cached --quiet; then
            echo "No changes to commit, skipping push."
          else
            git commit -m "Auto-update Cloudflare IPs and classify by region"
            git push
          fi
